server.port=8080
spring.application.name=agentx-campus-core

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/agentx_campus?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true

agentx.jwt.secret=${JWT_SECRET:AgentXCampusSuperSecretKeyForJwtAuthentication2026SecureHashMustBeLongAndSafe}
agentx.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
agentx.jwt.refresh-expiration-ms=604800000

# Actuator Observability & Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.jackson.serialization.fail-on-empty-beans=false

# Groq AI Service Configuration (Strictly loaded from Environment Variable GROQ_API_KEY)
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.api.url=https://api.groq.com/openai/v1/chat/completions

# RAG & RAGFlow Enterprise Knowledge Integration
rag.provider=${RAG_PROVIDER:auto}
ragflow.enabled=${RAGFLOW_ENABLED:false}
ragflow.base-url=${RAGFLOW_BASE_URL:http://localhost:9380}
ragflow.api-key=${RAGFLOW_API_KEY:}
ragflow.dataset-id=${RAGFLOW_DATASET_ID:}
ragflow.connect-timeout-ms=${RAGFLOW_CONNECT_TIMEOUT_MS:5000}
ragflow.read-timeout-ms=${RAGFLOW_READ_TIMEOUT_MS:10000}
ragflow.max-retries=${RAGFLOW_MAX_RETRIES:2}
