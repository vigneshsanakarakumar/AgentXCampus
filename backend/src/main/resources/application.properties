server.port=8080
spring.application.name=agentx-campus-core

spring.datasource.url=jdbc:mysql://localhost:3306/agentx_campus?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true

agentx.jwt.secret=AgentXCampusSuperSecretKeyForJwtAuthentication2026SecureHashMustBeLongAndSafe
agentx.jwt.expiration-ms=86400000
agentx.jwt.refresh-expiration-ms=604800000

spring.jackson.serialization.fail-on-empty-beans=false

# Groq AI Service Configuration (Strictly loaded from Environment Variable GROQ_API_KEY)
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
