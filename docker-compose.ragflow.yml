version: '3.8'

# Dedicated Standalone RAGFlow Deployment Stack (Infiniflow RAGFlow v0.16.0)
# Use this compose file to spin up RAGFlow and its dependent services independently:
# docker compose -f docker-compose.ragflow.yml up -d

services:
  ragflow-redis:
    image: redis:7.2.4-alpine
    container_name: ragflow-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ragflow_redis_data:/data
    networks:
      - ragflow-net

  ragflow-minio:
    image: minio/minio:RELEASE.2023-12-20T01-00-02Z
    container_name: ragflow-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ragflow
      MINIO_ROOT_PASSWORD: ragflowadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ragflow_minio_data:/data
    networks:
      - ragflow-net

  ragflow-server:
    image: infiniflow/ragflow:v0.16.0
    container_name: ragflow-server
    restart: always
    depends_on:
      - ragflow-redis
      - ragflow-minio
    ports:
      - "9380:9380"
    environment:
      - DOC_ENGINE=infinity
      - REDIS_HOST=ragflow-redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=ragflow-minio:9000
      - MINIO_ACCESS_KEY=ragflow
      - MINIO_SECRET_KEY=ragflowadmin
    volumes:
      - ragflow_server_data:/ragflow/data
    networks:
      - ragflow-net

networks:
  ragflow-net:
    driver: bridge

volumes:
  ragflow_redis_data:
  ragflow_minio_data:
  ragflow_server_data:
